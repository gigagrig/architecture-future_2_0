  <text x="280.0" y="109.2" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#172554">
    <tspan x="280.0" y="109.2">Цвет: серый — внешняя система; голубой — приложение / компонент;</tspan>
    <tspan x="280.0" y="123.6">фиолетовый — аналитика; зелёный — доступ, аудит или проверки.</tspan>
    <tspan x="280.0" y="138.0">Стрелка: инициатор → получатель; ответ подразумевается.</tspan>
    <tspan x="280.0" y="152.4">Зелёный пунктир — доступ / аудит; оранжевый — опциональная связь.</tspan>
    <tspan x="280.0" y="166.8">Оранжевая рамка — опциональный элемент; пунктирная серая — граница.</tspan>
    <tspan x="280.0" y="181.2">Медкарты, истории болезней и результаты исследований исключены.</tspan>
  </text>
