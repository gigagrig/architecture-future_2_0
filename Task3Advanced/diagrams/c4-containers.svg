  <text x="246.5" y="149.39999999999998" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#172554">
    <tspan x="246.5" y="149.39999999999998">Легенда: тёмно-синий — человек; серый — внешняя система.</tspan>
    <tspan x="246.5" y="163.79999999999998">Голубой — приложение / компонент; зелёный — защита и аудит.</tspan>
