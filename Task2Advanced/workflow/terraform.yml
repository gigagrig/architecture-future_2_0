# Preliminary MVP. Copy to .github/workflows only after the README checklist.
name: Draft Terraform deployment
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [dev, stage, prod]
        default: dev
      operation:
        description: Plan only or explicitly apply a freshly generated plan
        required: true
        type: choice
        options: [plan, apply]
        default: plan

permissions:
  contents: read

concurrency:
  group: future-terraform-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  terraform:
    if: github.ref == 'refs/heads/develop' && vars.CLOUD_MVP_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    defaults:
      run:
        shell: bash
        working-directory: Task2Advanced/terraform
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      DEPLOY_ENV: ${{ inputs.environment }}
      TF_VAR_environment: ${{ inputs.environment }}
      TF_VAR_folder_id: ${{ vars.YC_FOLDER_ID }}
      TF_VAR_zone: ${{ vars.YC_ZONE }}
      TF_VAR_image_id: ${{ vars.YC_IMAGE_ID }}
      TF_VAR_subnet_id: ${{ vars.YC_SUBNET_ID }}
      TF_VAR_security_group_ids: ${{ vars.YC_SECURITY_GROUP_IDS }}
      TF_VAR_ssh_public_key: ${{ vars.VM_SSH_PUBLIC_KEY }}
      STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      LOCK_ENDPOINT: ${{ vars.YDB_DOCUMENT_API_ENDPOINT }}
      LOCK_TABLE: ${{ vars.TF_LOCK_TABLE }}
      AWS_ACCESS_KEY_ID: ${{ secrets.YC_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET_ACCESS_KEY }}
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      # TODO: pin action versions to audited commit SHAs before enabling.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4
          terraform_wrapper: false
      - name: Check required settings and prepare provider credentials
        env:
          YC_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          for setting in TF_VAR_folder_id TF_VAR_zone TF_VAR_image_id TF_VAR_subnet_id TF_VAR_security_group_ids TF_VAR_ssh_public_key STATE_BUCKET LOCK_ENDPOINT LOCK_TABLE AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY YC_KEY_JSON; do
            if [[ -z "${!setting}" ]]; then
              printf 'Missing setting: %s\n' "$setting" >&2
              exit 1
            fi
          done
          umask 077
          printf '%s' "$YC_KEY_JSON" > "$RUNNER_TEMP/yc-service-account.json"
          printf 'YC_SERVICE_ACCOUNT_KEY_FILE=%s\n' "$RUNNER_TEMP/yc-service-account.json" >> "$GITHUB_ENV"
      - name: Check formatting
        run: terraform fmt -check -recursive ../..
      - name: Initialize remote state
        run: |
          set -euo pipefail
          terraform init -input=false -lockfile=readonly \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="key=future-2-0/$DEPLOY_ENV/terraform.tfstate" \
            -backend-config="endpoints={s3=\"https://storage.yandexcloud.net\",dynamodb=\"$LOCK_ENDPOINT\"}" \
            -backend-config="dynamodb_table=$LOCK_TABLE"
      - name: Validate
        run: terraform validate
      - name: Build plan without publishing its contents
        run: |
          set -euo pipefail
          terraform plan -input=false -lock-timeout=120s \
            -var-file="../envs/$DEPLOY_ENV.tfvars" \
            -out="$RUNNER_TEMP/deployment.tfplan" > "$RUNNER_TEMP/plan.log" 2>&1 || {
              printf 'Plan failed. Review locally with authorized access; no state or plan is published.\n' >&2
              exit 1
            }
          printf 'Plan created for %s at commit %s.\n' "$DEPLOY_ENV" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          terraform show -json "$RUNNER_TEMP/deployment.tfplan" | jq -r '[.resource_changes[]?.change.actions | join("+")] | group_by(.) | .[] | "\(.[0]): \(length)"' >> "$GITHUB_STEP_SUMMARY"
      - name: Apply explicitly requested plan
        if: inputs.operation == 'apply'
        run: |
          set -euo pipefail
          terraform apply -input=false -lock-timeout=120s "$RUNNER_TEMP/deployment.tfplan" > "$RUNNER_TEMP/apply.log" 2>&1 || {
              printf 'Apply failed. Inspect remote state and resources before retrying.\n' >&2
              exit 1
            }
          printf 'Apply completed for %s.\n' "$DEPLOY_ENV" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary credentials and plans
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/yc-service-account.json" "$RUNNER_TEMP/deployment.tfplan" "$RUNNER_TEMP/plan.log" "$RUNNER_TEMP/apply.log"
          rm -rf .terraform
